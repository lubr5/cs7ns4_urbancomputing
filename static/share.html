<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Share a Reading</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>Dublin Noise</h1>
    <nav>
      <a href="/">Map</a>
      <a href="/insights">Insights</a>
      <a href="/share" class="current">Share</a>
      <a href="/about">About</a>
    </nav>
    <div class="token">
      <label for="token">Your token</label>
      <input id="token" autocomplete="off" spellcheck="false" placeholder="e.g. Lucia">
      <button id="save-token" type="button">Save</button>
    </div>
  </header>

  <main class="scroll">
    <div class="page">
      <section class="panel">
        <h2>Share a reading</h2>
        <p class="hint">Share how loud it is where you are, so other people can see the noise in places the DCC monitors do not cover.
          It appears on the map for 1 hour.</p>

        <div class="cards">
          <div class="card"><div class="label">Your noise now <span class="when">(last 30 s)</span></div><div class="value" id="s-level">-</div></div>
          <div class="card"><div class="label">Phone</div><div class="value" id="s-state">-</div><div class="sub" id="s-state-sub"></div></div>
        </div>

        <button id="share" class="primary" type="button" disabled>Share my reading</button>
        <span id="share-note" class="note"></span>
      </section>

      <section class="panel">
        <h2>What you have shared</h2>
        <ul id="shared-list" class="shared-list"></ul>
        <p id="shared-empty" class="status">Nothing shared</p>
        <button id="clear" class="danger" type="button" disabled>Clear my data</button>
        <span id="clear-note" class="note"></span>
      </section>
    </div>
  </main>

  <script src="/static/share.js"></script>
</body>
</html>
