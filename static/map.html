<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dublin Noise Map</title>
  <link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>Dublin Noise</h1>
    <nav>
      <a href="/" class="current">Map</a>
      <a href="/insights">Insights</a>
      <a href="/share">Share</a>
      <a href="/about">About</a>
    </nav>
    <div class="token">
      <label for="token">Your token</label>
      <input id="token" autocomplete="off" spellcheck="false" placeholder="e.g. Lucia">
      <button id="save-token" type="button">Save</button>
    </div>
  </header>

  <section id="dashboard">
    <div class="status-row">
      <div id="live-status" class="chip">Enter your token</div>
      <button id="refresh" class="reload" type="button">Refresh DCC data</button>
      <span id="refresh-note" class="note"></span>
    </div>
    <div class="cards">
      <div class="card">
        <div class="label">Your noise<span class="when">(last 30 s)</span></div>
        <div class="value" id="d-level">-</div>
        <div class="sub" id="d-level-sub">Estimated dB(A) from your phone</div>
      </div>
      <div class="card">
        <div class="label" id="d-nearest-label">Compared with nearest monitor</div>
        <div class="value" id="d-nearest">-</div>
        <div class="sub" id="d-nearest-sub"></div>
      </div>
      <div class="card">
        <div class="label">Compared with 3km radius</div>
        <div class="value" id="d-local">-</div>
        <div class="sub" id="d-local-sub"></div>
      </div>
      <div class="card">
        <div class="label">Compared with Dublin overall</div>
        <div class="value" id="d-city">-</div>
        <div class="sub" id="d-city-sub"></div>
      </div>
    </div>
  </section>

  <main>
    <div id="map"></div>
  </main>

  <script src="/static/vendor/leaflet/leaflet.js"></script>
  <script src="/static/map.js"></script>
</body>
</html>
