<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSV search</title>
<style>
body{font-family:system-ui,sans-serif;margin:16px}
input[type=search]{width:100%;max-width:400px;padding:8px;font-size:16px}
#msg{margin:8px 0;padding:8px;background:#fff3cd;border:1px solid #e0c060}
#count{margin:8px 0;color:#555}
.wrap{overflow-x:auto}
table{border-collapse:collapse;font-size:14px}
th,td{border:1px solid #ccc;padding:4px 8px;white-space:nowrap;text-align:left}
th{background:#f0f0f0;position:sticky;top:0}
</style>
</head>
<body>
<input id="q" type="search" placeholder="Search..." autofocus>
<div id="msg" hidden>
  Could not load the CSV automatically (this happens when the page is opened straight from disk).
  Choose the file instead: <input id="file" type="file" accept=".csv">
</div>
<div id="count"></div>
<div class="wrap"><table><thead id="head"></thead><tbody id="body"></tbody></table></div>

<script>
const CSV_URL = 'All_23Sept2026.csv';   // must sit next to this page
const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
let rows = [], text = [];

function show(csv) {
  const lines = csv.split(/\r?\n/).filter(l => /[^,\s]/.test(l));   // skips blank rows
  const head = lines.shift().split(',');
  $('head').innerHTML = '<tr>' + head.map(h => '<th>' + esc(h) + '</th>').join('') + '</tr>';
  $('body').innerHTML = lines.map(l => '<tr>' + l.split(',').map(c => '<td>' + esc(c) + '</td>').join('') + '</tr>').join('');
  rows = Array.from($('body').children);
  text = rows.map(r => r.textContent.toLowerCase());
  $('msg').hidden = true;
  filter();
}

function filter() {
  const terms = $('q').value.toLowerCase().split(/\s+/).filter(Boolean);
  let shown = 0;
  rows.forEach((r, i) => {
    const ok = terms.every(t => text[i].includes(t));
    r.style.display = ok ? '' : 'none';
    if (ok) shown++;
  });
  $('count').textContent = shown + ' of ' + rows.length + ' rows';
}

$('q').addEventListener('input', filter);
$('file').addEventListener('change', e => e.target.files[0].text().then(show));
fetch(CSV_URL).then(r => { if (!r.ok) throw new Error(r.status); return r.text(); }).then(show).catch(() => { $('msg').hidden = false; });
</script>
</body>
</html>
